# Merge-driven release: pushed to main → CI builds + publishes GitHub Release.
# No one pushes main or tags manually; the tag is created by `gh release create`.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Extract version
        id: ver
        shell: bash
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION}"

      - name: Check tag
        id: tag
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if [ -n "$(git tag -l "$TAG")" ]; then
            echo "tag $TAG exists, nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: bun run build:bin
        if: steps.tag.outputs.exists != 'true'

      - run: cp dist/ziptask dist/ziptask-linux-x86_64
        if: steps.tag.outputs.exists != 'true'

      - name: Pack release tarball
        id: pack
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          PLATFORM="linux-x86_64"
          # ASSET_PATTERN in the deploy framework is
          # '${APP_NAME}-${TAG}-${OS}-${ARCH}.tar.gz' with TAG=v<version>.
          ROOT_DIR="ziptask-${VERSION}-${PLATFORM}"
          ASSET="ziptask-v${VERSION}-${PLATFORM}.tar.gz"

          rm -rf "dist/${ROOT_DIR}"
          mkdir -p "dist/${ROOT_DIR}"
          install -m 0755 dist/ziptask "dist/${ROOT_DIR}/ziptask"

          MTIME=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner "--mtime=@${MTIME}" \
            -czf "dist/${ASSET}" -C dist "${ROOT_DIR}"
          rm -rf "dist/${ROOT_DIR}"

          echo "ASSET_NAME=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "ROOT_DIR=${ROOT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Verify the tarball unpacks cleanly
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ASSET="dist/${{ steps.pack.outputs.ASSET_NAME }}"
          ROOT_DIR="${{ steps.pack.outputs.ROOT_DIR }}"

          tar -tzvf "$ASSET"

          TOPS=$(tar -tzf "$ASSET" | cut -d/ -f1 | sort -u)
          [ "$TOPS" = "$ROOT_DIR" ] \
            || { echo "expected exactly one top-level directory ${ROOT_DIR}/, got: ${TOPS}" >&2; exit 1; }

          DEST="$RUNNER_TEMP/unpack"
          rm -rf "$DEST"; mkdir -p "$DEST"
          tar -xzf "$ASSET" -C "$DEST" --no-same-owner
          chmod +x "${DEST}/${ROOT_DIR}/ziptask"
          GOT=$("${DEST}/${ROOT_DIR}/ziptask" --version)
          [ "$GOT" = "ziptask ${VERSION}" ] \
            || { echo "version check failed: got '${GOT}', expected 'ziptask ${VERSION}'" >&2; exit 1; }
          echo "verified: ${ROOT_DIR}/ziptask --version -> ${GOT}"

      - name: Build Release Notes
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)
          REPO="${{ github.repository }}"
          COMMIT_FMT="- [\`%h\`](https://github.com/${REPO}/commit/%H): %s"

          TMP=$(mktemp)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.sha }}" --no-merges --pretty="$COMMIT_FMT" | grep -v CHANGELOG > "$TMP"
          else
            git log "${{ github.sha }}" --no-merges --pretty="$COMMIT_FMT" | grep -v CHANGELOG > "$TMP"
          fi

          FEATURES=$(grep -i '^-.*: *feat[:(]' "$TMP" || true)
          FIXES=$(grep -i '^-.*: *fix[:(]' "$TMP" || true)
          OTHER=$(grep -iv '^-.*: *feat[:(]\|^-.*: *fix[:(]' "$TMP" || true)

          {
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES"
              echo
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Diff**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          rm -f "$TMP"
          echo "Generated release notes:"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.tag.outputs.exists != 'true'
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            dist/ziptask-linux-x86_64 \
            "dist/${{ steps.pack.outputs.ASSET_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
