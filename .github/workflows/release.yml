# Merge-driven release: pushed to main → CI builds + publishes GitHub Release.
# No one pushes main or tags manually; the tag is created by `gh release create`.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Extract version
        id: ver
        shell: bash
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION}"

      - name: Check tag
        id: tag
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if [ -n "$(git tag -l "$TAG")" ]; then
            echo "tag $TAG exists, nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - run: bun run build:bin
        if: steps.tag.outputs.exists != 'true'

      - run: cp dist/ziptask dist/ziptask-linux-x86_64
        if: steps.tag.outputs.exists != 'true'

      - name: Build Release Notes
        if: steps.tag.outputs.exists != 'true'
        shell: bash
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)
          REPO="${{ github.repository }}"
          COMMIT_FMT="- [\`%h\`](https://github.com/${REPO}/commit/%H): %s"

          TMP=$(mktemp)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.sha }}" --no-merges --pretty="$COMMIT_FMT" | grep -v CHANGELOG > "$TMP"
          else
            git log "${{ github.sha }}" --no-merges --pretty="$COMMIT_FMT" | grep -v CHANGELOG > "$TMP"
          fi

          FEATURES=$(grep -i '^-.*: *feat[:(]' "$TMP" || true)
          FIXES=$(grep -i '^-.*: *fix[:(]' "$TMP" || true)
          OTHER=$(grep -iv '^-.*: *feat[:(]\|^-.*: *fix[:(]' "$TMP" || true)

          {
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES"
              echo
            fi
            if [ -n "$FIXES" ]; then
              echo "### Fixes"
              echo "$FIXES"
              echo
            fi
            if [ -n "$OTHER" ]; then
              echo "### Other"
              echo "$OTHER"
              echo
            fi
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Diff**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          rm -f "$TMP"
          echo "Generated release notes:"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.tag.outputs.exists != 'true'
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.ver.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            dist/ziptask-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
